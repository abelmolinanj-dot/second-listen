  if (!dg) return null;
  const at = (v) => (v != null ? " [" + fmt(v) + "]" : "");
  const L = [n.title, "Breakdown from Second Listen", ""];
  const head = (t) => L.push("", t.toUpperCase(), "");
  if (n.kit && n.kit.summary) { head("In plain words"); L.push(n.kit.summary); }
  if (arr(dg.keyIdeas).length) {
    head("Key ideas");
    for (const x of dg.keyIdeas) {
      L.push(x.name, "  " + ideaGist(x));
      if (x.def) L.push("  What it is: \"" + x.def.t + "\"" + at(x.def.at));
      for (const p of x.points) L.push("  - \"" + p.t + "\"" + at(p.at));
      if (x.example) L.push("  Example: \"" + x.example.t + "\"" + at(x.example.at));
      if (x.times.length > 1) L.push("  Mentioned at: " + x.times.map(fmt).join(", "));
      L.push("");
    }
  }
  const radar = radarOf(n);
  if (radar.length) { head("Exam radar"); radar.forEach((s) => L.push("- \"" + s.quote + "\"" + at(s.at))); }
  const shown = new Set(arr(dg.keyIdeas).map((x) => x.name.toLowerCase()));
  const vocab = dg.terms.filter((t) => !shown.has(t.name.toLowerCase()));
  if (arr(n.kit && n.kit.terms).length || vocab.length) {
    head("Vocabulary");
    arr(n.kit && n.kit.terms).forEach((t) => L.push(t.term + ": " + t.def));
    vocab.forEach((t) => L.push(t.name + " (" + t.count + (t.count === 1 ? " mention" : " mentions") + "): \"" + tidyQuote(t.context) + "\"" + at(t.at)));
  }
  const list = (title, rows) => { if (rows.length) { head(title); rows.forEach((e) => L.push(e.name + " (" + e.count + "): \"" + tidyQuote(e.context) + "\"" + at(e.at))); } };
  list(dg.english ? "People" : "Names", dg.people);
  list("Dates and numbers", dg.facts);
  list("Places and groups", dg.places);
  const outline = arr(n.kit && n.kit.outline).length ? null : arr(dg.outline);
  if (outline && outline.length) {
    head("Outline");
    outline.forEach((p, i) => {
      L.push((i + 1) + ". " + p.title + (p.start != null ? " (" + fmt(p.start) + (p.end != null ? "-" + fmt(p.end) : "") + ")" : ""));
      p.gist.forEach((q) => L.push("   - \"" + q.t + "\"" + at(q.at)));
      if (p.fresh.length) L.push("   First comes up here: " + p.fresh.join(", "));
    });
  } else if (n.kit && arr(n.kit.outline).length) {
    head("Outline");
    n.kit.outline.forEach((o, i) => { L.push((i + 1) + ". " + o.heading + at(parseAt(o.at))); o.points.forEach((p) => L.push("   - " + p)); });
  }
  L.push("", "Pulled from the transcript automatically. Quotes are what was said in class, lightly tidied.");
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}

/* Quiz */
function quizTab(n) {
  const quiz = arr(n.kit && n.kit.quiz);
  if (!quiz.length) return [h("p", { class: "it" }, "No quiz yet. Have Claude write your study kit to get one."), kitGate(n)];
  if (!state.quizRun || state.quizRun.noteId !== n.id) state.quizRun = { noteId: n.id, i: 0, score: 0, pick: null, misses: [] };
  const r = state.quizRun;
  if (r.i >= quiz.length) {
    return [h("div", { class: "stack center" },
      h("div", { class: "score" }, r.score + " / " + quiz.length),
      n.quizBest != null && h("p", { class: "it" }, "Your best is " + n.quizBest + " of " + quiz.length + "."),
      h("button", { class: "grand ghost", id: "retake", onclick: () => { state.quizRun = null; render(true); } }, "Take it again"),
      r.misses.length > 0 && S.sample && h("button", { class: "link", id: "explainMisses", onclick: () => ask(n, "I got these quiz questions wrong. Help me understand what I'm missing:\n" + r.misses.join("\n")) }, "Explain what I missed"))];
  }
  const q = quiz[r.i], picked = r.pick != null;
  return [h("p", { class: "small it" }, "Question " + (r.i + 1) + " of " + quiz.length),
    h("p", { style: "font-size:1.42rem;line-height:1.28" }, q.q),
    h("div", null, q.options.map((o, i) =>
      h("button", { class: "opt" + (picked && i === q.answer ? " right" : "") + (picked && i === r.pick && i !== q.answer ? " wrong" : ""), disabled: picked, onclick: () => {
        r.pick = i;
        if (i === q.answer) r.score++; else r.misses.push(q.q);
        render();
      } }, h("em", null, "abcdefgh"[i] + "."), h("span", null, o)))),
    picked && h("p", { class: "fade" }, h("i", { style: "color:var(--rouge)" }, r.pick === q.answer ? "Right. " : "Not quite. "), q.why),
    picked && parseAt(q.at) != null && h("button", { class: "link rouge", id: "hearQ", onclick: () => hear(parseAt(q.at)) }, "Hear where this was explained"),
    picked && h("button", { class: "grand", id: "nextQ", onclick: () => {
      r.i++; r.pick = null;
      if (r.i >= quiz.length && (n.quizBest == null || r.score > n.quizBest)) { n.quizBest = r.score; scheduleSave(n); }
      render(true);
    } }, r.i + 1 < quiz.length ? "Next question" : "See my score")];
}

/* Ask */
function askTab(n) {
  if (S.sample === undefined) return h("p", { class: "it" }, "Checking for Claude…");
  if (!S.sample) return h("p", { class: "it" }, "Asking questions uses Claude. Open this page while signed in to Claude to turn it on.");
  if (!n.segments.length) return h("p", { class: "it" }, "You can ask questions once there's some transcript.");
  const chat = chatOf(n.id);
  const box = h("textarea", { id: "askBox", style: "min-height:80px", placeholder: "Ask about this class", "aria-label": "Your question" });
  const lost = n.segments.filter((s) => s.lost);
  const quick = [
    lost.length > 0 && ["Explain the parts I got lost in", "I got lost at these moments. Explain each one simply:\n" + lost.map((s) => (s.s != null ? "[" + fmt(s.s) + "] " : "") + s.t).join("\n")],
    ["What's the hardest idea here? Explain it simply."], ["What's most likely to be on the exam?"], ["Give me a 5-minute review."]
  ].filter(Boolean);
  return [
    !chat.turns.length && !chat.busy && h("div", null, quick.map(([label, q]) => h("button", { class: "opt", style: "grid-template-columns:minmax(0,1fr);font-style:italic", onclick: () => ask(n, q || label) }, h("span", null, label)))),
    h("div", { class: "stack" },
      chat.turns.map((t) => h("div", { class: "line" }, h("span", { class: "caps" }, t.role === "user" ? "You" : "Second Listen"), h("div", null, t.role === "user" ? t.content : withTimes(t.content)))),
      chat.busy && h("div", { class: "line" }, h("span", { class: "caps" }, "Second Listen"), h("div", { id: "liveMsg" }, chat.busy.text || "Thinking…"))),
    chat.error && h("p", { class: "err" }, chat.error),
    chat.busy
      ? h("button", { class: "link", id: "stopAsk", onclick: () => chat.busy.ctl.abort() }, "Stop")
      : h("form", { class: "stack", onsubmit: (e) => { e.preventDefault(); ask(n, box.value); } }, box, h("button", { class: "grand", id: "sendAsk", type: "submit" }, "Ask"))];
}

/* ---------- Device check: open this page with #selftest ---------- */
async function selfTest() {
  const box = h("p", { id: "selftest" }, "Checking the speech model…");
  document.body.append(box);
  const t0 = performance.now();
  try {
    const w = await makeWorker((f, n) => { box.textContent = "Preparing the speech model… " + Math.round(n / 1048576) + " MB of " + f; }, location.hash === "#selftest-languages");
    const tLoad = (performance.now() - t0) / 1000, t1 = performance.now();
    const audio = new Float32Array(SR * 5);
    for (let i = 0; i < audio.length; i++) audio[i] = 0.2 * Math.sin((2 * Math.PI * 220 * i) / SR);
    await w.run(audio);
    w.end();
    box.textContent = "The speech model works here. Loaded in " + tLoad.toFixed(1) + " s. Handled 5 s of test sound in " + ((performance.now() - t1) / 1000).toFixed(1) + " s.";
  } catch (e) { box.textContent = "The speech model failed: " + (e.message || e); }
}

render();
initStore();
if (location.hash.startsWith("#selftest")) selfTest();
window.addEventListener("hashchange", () => { if (location.hash.startsWith("#selftest") && !$("#selftest")) selfTest(); });

use("sample").then((s) => { S.sample = s; if (state.view === "note" && !typing()) render(); });
use("downloads").then((d) => { S.downloads = d; if (d && state.view === "note" && !typing()) render(); });
